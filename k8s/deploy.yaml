apiVersion: v1
kind: ConfigMap
metadata:
  name: jh-h5-nginx
  namespace: jh-test
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location /api/ {
        proxy_pass http://jh-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Site-Code jh;
        proxy_set_header X-Site-Id 1;
      }

      location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
      }

      location = /index.html {
        add_header Cache-Control "no-cache";
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jh-h5
  namespace: jh-test
  labels:
    app: jh-h5
    env: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jh-h5
  template:
    metadata:
      labels:
        app: jh-h5
        env: test
    spec:
      containers:
        - name: jh-h5
          image: jh_h5:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: nginx-conf
          configMap:
            name: jh-h5-nginx
---
