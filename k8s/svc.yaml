apiVersion: v1
kind: Service
metadata:
  name: jh-h5
  namespace: jh-test
  labels:
    app: jh-h5
    env: test
spec:
  selector:
    app: jh-h5
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: jh-h5
  namespace: jh-prod
  labels:
    app: jh-h5
    env: prod
spec:
  selector:
    app: jh-h5
  ports:
    - name: http
      port: 80
      targetPort: http
